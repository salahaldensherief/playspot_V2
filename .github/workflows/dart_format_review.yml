name: Dart formatting review

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Prepare formatting patch
        run: |
          dart format lib test
          git diff --binary > dart-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: dart-format-review
          path: dart-format.patch
          retention-days: 3
