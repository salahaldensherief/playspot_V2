<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <defs>
        <!-- Background Dark Radial Gradient -->
        <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#0F172A" />
            <stop offset="60%" stop-color="#080C14" />
            <stop offset="100%" stop-color="#04060A" />
        </radialGradient>

        <!-- Neon Cyan Bloom Glow Filter -->
        <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="16" result="blur1" />
            <feGaussianBlur stdDeviation="32" result="blur2" />
            <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Intense Joystick Sphere Glow -->
        <filter id="ballGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Metallic Shaft Gradient -->
        <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#80EEFF" />
            <stop offset="50%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#00B8D9" />
        </linearGradient>

        <!-- Joystick Head Radial Highlight -->
        <radialGradient id="joystickHead" cx="35%" cy="30%" r="65%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="25%" stop-color="#00E5FF" />
            <stop offset="85%" stop-color="#0088A8" />
            <stop offset="100%" stop-color="#004D61" />
        </radialGradient>
    </defs>

    <!-- Canvas Background with rounded squircle corners -->
    <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bgGlow)" />

    <!-- Subtle Outer Border Highlighting Frame -->
    <rect x="2" y="2" width="1020" height="1020" rx="222" ry="222" fill="none" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.25" />

    <!-- Center Wordmark Group -->
    <g transform="translate(512, 512)">

        <!-- "PlaySp" Text -->
        <text x="-390" y="38"
            font-family="Orbitron, 'Arial Black', sans-serif"
            font-weight="900"
            font-size="124"
            fill="#FFFFFF"
            letter-spacing="2">PlaySp</text>

        <!-- Stylized Joystick 'O' Replacement -->
        <g transform="translate(185, -10)">

            <!-- Outer Glowing Base Ring -->
            <ellipse cx="0" cy="55" rx="52" ry="20" fill="none" stroke="#00E5FF" stroke-width="6" filter="url(#neonGlow)" />
            <ellipse cx="0" cy="55" rx="36" ry="14" fill="#0A0E17" stroke="#00E5FF" stroke-width="4" />

            <!-- Joystick Shaft -->
            <line x1="0" y1="45" x2="-8" y2="-15" stroke="url(#shaftGrad)" stroke-width="14" stroke-linecap="round" />

            <!-- Glowing Joystick Top Ball -->
            <circle cx="-12" cy="-35" r="42" fill="url(#joystickHead)" filter="url(#ballGlow)" />
            <circle cx="-12" cy="-35" r="42" fill="none" stroke="#00E5FF" stroke-width="2" />
            <circle cx="-24" cy="-48" r="10" fill="#FFFFFF" opacity="0.8" />
        </g>

        <!-- "t" Text -->
        <text x="260" y="38"
            font-family="Orbitron, 'Arial Black', sans-serif"
            font-weight="900"
            font-size="124"
            fill="#FFFFFF"
            letter-spacing="2">t</text>

    </g>
</svg>