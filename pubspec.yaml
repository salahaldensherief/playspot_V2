name: playspot
description: "PlayStation room booking app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.5
  get_it: ^7.6.7
  equatable: ^2.0.5

#  # Supabase
#  supabase_flutter: ^2.5.0

#  # Location
#  geolocator: ^11.0.0
#  geocoding: ^3.0.0
#  permission_handler: ^11.3.1

#  # Payment
#  webview_flutter: ^4.7.0
#  dio: ^5.4.3

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10
  smooth_page_indicator: ^1.1.0
  url_launcher: ^6.2.5
  get_storage: ^2.1.1
  flutter_tabler_icons: ^1.43.0
  flutter_screenutil: ^5.9.3
  photo_view: ^0.15.0
  easy_localization: ^3.0.7
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.6
  webview_flutter: ^4.7.0
  image_picker: ^1.2.1
  qr_flutter: ^4.1.0








  #  # Booking
#  qr_flutter: ^4.1.0
#  table_calendar: ^3.1.2
#  intl: ^0.19.0

#  # Notifications
#  firebase_messaging: ^15.0.0
#  flutter_local_notifications: ^17.2.0

#  # Storage
#  shared_preferences: ^2.2.3
#  flutter_secure_storage: ^9.2.2

  # Utils
  connectivity_plus: ^6.0.3
  pretty_dio_logger: ^1.3.1
  dartz: ^0.10.1
  go_router: ^17.2.3
  supabase_flutter: ^2.12.4
  crypto: ^3.0.3
  geolocator: ^14.0.3
  geocoding: ^4.0.0
  permission_handler: ^12.0.3
  intl: ^0.20.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
#    - assets/animations/
    - assets/lang/en.json
    - assets/lang/ar.json
    - assets/fonts/

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron/Orbitron-Regular.ttf
          weight: 400
        - asset: assets/fonts/Orbitron/Orbitron-Medium.ttf
          weight: 500
        - asset: assets/fonts/Orbitron/Orbitron-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Orbitron/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/fonts/Orbitron/Orbitron-ExtraBold.ttf
          weight: 800